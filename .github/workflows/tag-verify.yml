name: tag-verify

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install the package
        run: python -m pip install --quiet .
      - name: The tag must equal the packaged version
        run: |
          packaged="v$(python -m rncc_calc --version)"
          echo "tag=${GITHUB_REF_NAME} packaged=${packaged}"
          test "${GITHUB_REF_NAME}" = "${packaged}"
