name: deploy

on:
  push:
    branches: [staging, production]

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install the package
        run: python -m pip install --quiet .
      - name: Deploy (stand-in)
        run: |
          version="$(python -m rncc_calc --version)"
          echo "Deploying rncc_calc ${version} to ${GITHUB_REF_NAME} at ${GITHUB_SHA}"
          echo "### rncc_calc ${version} deployed to ${GITHUB_REF_NAME}" >> "$GITHUB_STEP_SUMMARY"
