name: deploy

on:
  workflow_call:
    inputs:
      environment:
        description: GitHub Environment to deploy to (staging or production)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install the package
        run: python -m pip install --quiet .
      - name: Deploy (stand-in)
        run: |
          version="$(python -m rncc_calc --version)"
          echo "Deploying rncc_calc ${version} to ${{ inputs.environment }} at ${GITHUB_SHA}"
          echo "### rncc_calc ${version} deployed to ${{ inputs.environment }}" >> "$GITHUB_STEP_SUMMARY"
