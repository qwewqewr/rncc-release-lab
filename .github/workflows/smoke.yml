name: smoke

on:
  push:
    branches: [main, staging, production]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install the package and pytest
        run: python -m pip install --quiet . pytest
      - name: Run the tests
        run: python -m pytest -q
      - name: Print the version that will be released
        run: python -m rncc_calc --version
